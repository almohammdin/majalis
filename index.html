<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B1A2B">
<title>مجالس | منظومة أعمال المجالس</title>
<meta name="description" content="مجالس لإعداد الدعوات وجداول الأعمال والمحاضر والقرارات وفق نوع الجهة وطبيعة الاجتماع">
<meta property="og:type" content="website">
<meta property="og:title" content="مجالس | منظومة أعمال المجالس">
<meta property="og:description" content="إعداد الدعوات وجداول الأعمال والمحاضر والقرارات وفق نوع الجهة وطبيعة الاجتماع">
<meta property="og:image" content="https://almohammdin.github.io/majalis/og-image.png">
<link rel="canonical" href="https://almohammdin.github.io/majalis/">
<style>
html,body{margin:0;min-height:100%;background:#F3F5F7;font-family:Tahoma,Arial,sans-serif;color:#0B1A2B}.boot{min-height:100vh;display:grid;place-items:center;text-align:center}.boot strong{display:block;font-size:22px}.boot span{display:block;margin-top:7px;color:#677386;font-size:13px}
</style>
</head>
<body>
<div class="boot" id="boot"><div><strong>مجالس</strong><span>جاري تحميل المنصة...</span></div></div>
<script>
(async()=>{
  const VERSION='1.15.9';
  try{
    const response=await fetch(`./majalis-app-v1159.html?v=${VERSION}`,{cache:'no-store'});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    let html=await response.text();
    html=html.replace(/([?&]v=)1\.15\.(?:7|8)(?=["'&<])/g,`$1${VERSION}`);
    const upgrade=`<script type="module" src="./majalis-upgrade.js?v=${VERSION}"><\/script>`;
    const final=`<script type="module" src="./majalis-final-v1159.js?v=${VERSION}"><\/script>`;
    if(!html.includes('majalis-final-v1159.js'))html=html.replace(upgrade,upgrade+'\n'+final);
    document.open();document.write(html);document.close();
  }catch(error){
    console.error('Majalis bootstrap failed:',error);
    document.getElementById('boot').innerHTML='<div><strong>تعذر تحميل مجالس</strong><span>أعد تحميل الصفحة.</span></div>';
  }
})();
</script>
</body>
</html>
