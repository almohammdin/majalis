<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>لوحة التحكم الاستثمارية | مجالس</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--n:#071a31;--g:#c9a84c;--bg:#f2f5f8;--l:#dfe6ec;--m:#68778a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'IBM Plex Sans Arabic',Arial;color:#172235}.hero{background:linear-gradient(145deg,#05101f,var(--n),#153b5e);color:#fff;padding:28px 18px}.w{max-width:1120px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:20px}.brand small{display:block;color:#ead58d;font-size:10px}.version{display:inline-block;margin-top:5px;font-size:9px;color:#b9c7d6}.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--g);color:var(--n)}.ghost{background:#edf1f5;color:var(--n)}.main{padding:26px 18px}.panel{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;box-shadow:0 14px 38px rgba(7,26,49,.08)}.gate{max-width:480px;margin:55px auto}.pass-row{display:flex;gap:8px}.pass-row input{flex:1;border:1px solid var(--l);border-radius:11px;padding:11px;font:inherit;text-align:center;letter-spacing:5px;font-size:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{padding:9px 13px;border-radius:999px;border:1px solid var(--l);background:#fff;cursor:pointer;font:inherit;font-weight:800}.tab.active{background:var(--n);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:11px;font-weight:800;color:#526174;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--l);border-radius:11px;padding:10px;font:inherit}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.status{display:none;margin-top:12px;padding:12px;border-radius:11px;background:#eef7f2;color:#236348;font-size:11px;white-space:pre-line}.warn{background:#fff5e8;color:#8a5316}.hint{font-size:10px;color:var(--m)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.brand{font-size:18px}.btn{padding:9px 11px}.pass-row{flex-direction:column}}
</style>
</head>
<body>
<header class="hero"><div class="w"><div class="top"><div class="brand">لوحة التحكم الاستثمارية<small>مرحلة البذرة وما قبل البذرة</small><span class="version">الإصدار 2.1 - دخول برقم سري</span></div><a id="view" class="btn ghost" href="pre-seed.html">فتح صفحة المستثمر</a></div></div></header>
<main class="main"><div class="w">
<section id="gate" class="panel gate"><h2>دخول لوحة التحكم</h2><p>أدخل الرقم السري للمتابعة.</p><div class="pass-row"><input id="password" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off"><button id="login" class="btn primary">دخول</button></div><div id="loginStatus" class="status"></div></section>
<section id="work" class="panel" style="display:none"><div class="tabs"><button class="tab active" data-stage="preseed">ما قبل البذرة</button><button class="tab" data-stage="seed">مرحلة البذرة</button></div><div class="field full"><label>طريقة الربط الحسابي</label><select id="mode"></select><p class="hint">الأرقام أدناه هي القيم الافتراضية المتفق عليها، ويمكنك تعديلها بالزيادة أو النقصان.</p></div><div id="form" class="grid"></div><div class="actions"><button id="save" class="btn primary">حفظ ونشر</button><button id="reset" class="btn ghost">استعادة الأرقام المتفق عليها</button><button id="logout" class="btn ghost">تسجيل الخروج</button></div><div id="status" class="status"></div></section>
</div></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import{getDatabase,ref,get,set}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
const cfg={apiKey:'AIzaSyCbtCvh99akHaMoOgwSaCnET8zhsoUBL3o',authDomain:'majalis-development.firebaseapp.com',databaseURL:'https://majalis-development-default-rtdb.firebaseio.com',projectId:'majalis-development',storageBucket:'majalis-development.firebasestorage.app',messagingSenderId:'551557724460',appId:'1:551557724460:web:eed6bc7ddd37fe67db5489'};
const PASS='012345',app=initializeApp(cfg),db=getDatabase(app);
const D={
 preseed:{headline:'تمويل الانتقال من منتج أولي مستخدم إلى شركة تقنية جاهزة لجولة البذرة.',investmentAmount:375000,investorPct:5,postMoney:7500000,preMoney:7125000,months:9,seedTarget:30000000,seedRaise:8000000,customers:15,arr:500000,case1Pct:5,case2Pct:6,case3Pct:7.5,case4Pct:10},
 seed:{headline:'جولة لتمويل التوسع التجاري وبناء منصة سعودية لإدارة القرارات المؤسسية.',raiseAmount:8000000,preMoney:30000000,postMoney:38000000,investorPct:21.0526,months:24,customers:60,arr:4000000,growth:'2.3×',margin:'70%+'}
};
const F={
 preseed:[['وصف العرض','headline','text'],['مبلغ الاستثمار','investmentAmount'],['حصة المستثمر %','investorPct'],['التقييم بعد الاستثمار','postMoney'],['التقييم قبل الاستثمار','preMoney'],['مدة التنفيذ بالأشهر','months'],['تقييم جولة البذرة المستهدف','seedTarget'],['حجم جولة البذرة','seedRaise'],['العملاء المستهدفون','customers'],['الإيراد السنوي المتكرر','arr'],['الحالة الأولى %','case1Pct'],['الحالة الثانية %','case2Pct'],['الحالة الثالثة %','case3Pct'],['الحد الأقصى للحماية %','case4Pct']],
 seed:[['وصف الجولة','headline','text'],['حجم الجولة','raiseAmount'],['التقييم قبل الاستثمار','preMoney'],['التقييم بعد الاستثمار','postMoney'],['حصة الجولة %','investorPct'],['مدة التشغيل بالأشهر','months'],['العملاء المستهدفون','customers'],['الإيراد السنوي المتكرر','arr'],['النمو السنوي','growth','text'],['الهامش الإجمالي','margin','text']]
};
let stage='preseed';
const $=s=>document.querySelector(s),form=$('#form'),status=$('#status'),loginStatus=$('#loginStatus'),mode=$('#mode');
function show(el,t,w=0){el.textContent=t;el.className='status'+(w?' warn':'');el.style.display='block'}
function msg(t,w=0){show(status,t,w)}
function clean(saved,defaults){const out={...defaults};if(saved&&typeof saved==='object')for(const k of Object.keys(defaults)){const v=saved[k];if(v!==undefined&&v!==null&&v!==''&&!Number.isNaN(v))out[k]=v}return out}
function opts(){mode.innerHTML=stage==='preseed'?'<option value="amount">تثبيت مبلغ الاستثمار وتعديل التقييم</option><option value="post">تثبيت التقييم وتعديل المبلغ</option><option value="both">تثبيت المبلغ والتقييم وحساب النسبة</option>':'<option value="raise">تثبيت حجم الجولة وتعديل الحصة</option><option value="pct">تثبيت الحصة وتعديل التقييم</option><option value="pre">تثبيت التقييم قبل الاستثمار وتعديل حجم الجولة</option>'}
function draw(d){form.innerHTML='';F[stage].forEach(([l,k,t='number'])=>form.insertAdjacentHTML('beforeend',`<div class="field ${k==='headline'?'full':''}"><label>${l}</label><input data-k="${k}" type="${t}" ${t==='number'?'step="0.01" min="0"':''} value="${d[k]??D[stage][k]}"></div>`));opts();$('#view').href=stage==='preseed'?'pre-seed.html':'investment.html'}
function vals(){const o={};document.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.type==='number'?Number(i.value):i.value.trim());return o}
function put(k,n,a){const i=document.querySelector(`[data-k="${k}"]`),x=Math.round(n*10000)/10000;if(i&&Number(i.value)!==x){i.value=x;a.push(i.previousElementSibling.textContent)}}
function calc(showIt=1){const v=vals(),a=[];if(stage==='preseed'){const p=v.investorPct/100;if(mode.value==='amount'&&p>0){const post=v.investmentAmount/p;put('postMoney',post,a);put('preMoney',post-v.investmentAmount,a)}else if(mode.value==='post'){const amt=v.postMoney*p;put('investmentAmount',amt,a);put('preMoney',v.postMoney-amt,a)}else if(v.postMoney>0){put('investorPct',v.investmentAmount/v.postMoney*100,a);put('preMoney',v.postMoney-v.investmentAmount,a)}}else{if(mode.value==='raise'){const post=v.preMoney+v.raiseAmount;put('postMoney',post,a);put('investorPct',v.raiseAmount/post*100,a)}else if(mode.value==='pct'&&v.investorPct>0){const post=v.raiseAmount/(v.investorPct/100);put('postMoney',post,a);put('preMoney',post-v.raiseAmount,a)}else{const post=v.preMoney+v.raiseAmount;put('postMoney',post,a);put('raiseAmount',post*(v.investorPct/100),a)}}if(showIt&&a.length)msg('تم الربط تلقائيا: '+a.join('، '))}
async function load(){draw(D[stage]);try{const s=await get(ref(db,'investment/'+stage));draw(clean(s.val(),D[stage]))}catch(e){msg('ظهرت الأرقام الافتراضية المتفق عليها. تعذر تحميل أي تعديلات محفوظة.',1)}}
function openPanel(){sessionStorage.setItem('majalisInvestmentAdmin','1');$('#gate').style.display='none';$('#work').style.display='block';load()}
function login(){if($('#password').value===PASS){loginStatus.style.display='none';openPanel()}else show(loginStatus,'الرقم السري غير صحيح.',1)}
$('#login').onclick=login;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('#logout').onclick=()=>{sessionStorage.removeItem('majalisInvestmentAdmin');$('#work').style.display='none';$('#gate').style.display='block';$('#password').value=''};
document.addEventListener('input',e=>{if(e.target.matches('[data-k],#mode'))calc()});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');stage=b.dataset.stage;load()});
$('#save').onclick=async()=>{calc(0);const data=clean(vals(),D[stage]);draw(data);try{await set(ref(db,'investment/'+stage),data);msg('تم الحفظ والنشر، وستظهر القيم مباشرة في صفحة المستثمر.')}catch(e){msg('تعذر الحفظ في Firebase: '+e.message,1)}};
$('#reset').onclick=()=>{draw(D[stage]);msg('تمت استعادة الأرقام والنسب المتفق عليها. اضغط حفظ لنشرها.',1)};
if(sessionStorage.getItem('majalisInvestmentAdmin')==='1')openPanel();
</script>
</body></html>
