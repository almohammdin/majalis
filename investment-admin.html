<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم الاستثمارية | مجالس</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--n:#071a31;--g:#c9a84c;--bg:#f2f5f8;--l:#dfe6ec;--m:#68778a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'IBM Plex Sans Arabic',Arial;color:#172235}.hero{background:linear-gradient(145deg,#05101f,var(--n),#153b5e);color:#fff;padding:28px 18px}.w{max-width:1120px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:20px}.brand small{display:block;color:#ead58d;font-size:10px}.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--g);color:var(--n)}.ghost{background:#edf1f5;color:var(--n)}.main{padding:26px 18px}.panel{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;box-shadow:0 14px 38px rgba(7,26,49,.08)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{padding:9px 13px;border-radius:999px;border:1px solid var(--l);background:#fff;cursor:pointer;font:inherit;font-weight:800}.tab.active{background:var(--n);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:10px;font-weight:800;color:#526174;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--l);border-radius:11px;padding:10px;font:inherit}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.status{display:none;margin-top:12px;padding:12px;border-radius:11px;background:#eef7f2;color:#236348;font-size:11px;white-space:pre-line}.warn{background:#fff5e8;color:#8a5316}.gate{max-width:480px;margin:55px auto}.hint{font-size:10px;color:var(--m)}.login-note{margin-top:12px;font-size:10px;color:var(--m)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.brand{font-size:18px}.btn{padding:9px 11px}}</style></head><body><header class="hero"><div class="w"><div class="top"><div class="brand">لوحة التحكم الاستثمارية<small>مرحلة البذرة وما قبل البذرة</small></div><a id="view" class="btn ghost" href="pre-seed.html">فتح صفحة المستثمر</a></div></div></header><main class="main"><div class="w"><section id="gate" class="panel gate"><h2>تسجيل الدخول</h2><p>الدخول متاح للحساب المصرح فقط.</p><button id="login" class="btn primary">الدخول بحساب Google</button><p class="login-note">اختر حساب Google، وستظهر رسالة واضحة إذا كان الحساب غير مصرح أو كان النطاق يحتاج إعدادًا في Firebase.</p><div id="loginStatus" class="status"></div></section><section id="work" class="panel" style="display:none"><div class="tabs"><button class="tab active" data-stage="preseed">ما قبل البذرة</button><button class="tab" data-stage="seed">مرحلة البذرة</button></div><div class="field full"><label>طريقة الربط الحسابي</label><select id="mode"></select><p class="hint">عند تعديل رقم، تتغير القيم المرتبطة تلقائيا وتظهر رسالة توضح ذلك.</p></div><div id="form" class="grid"></div><div class="actions"><button id="save" class="btn primary">حفظ ونشر</button><button id="reset" class="btn ghost">استعادة الافتراضي</button><button id="logout" class="btn ghost">تسجيل الخروج</button></div><div id="status" class="status"></div></section></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getDatabase,ref,get,set}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';const cfg={apiKey:'AIzaSyCbtCvh99akHaMoOgwSaCnET8zhsoUBL3o',authDomain:'majalis-development.firebaseapp.com',databaseURL:'https://majalis-development-default-rtdb.firebaseio.com',projectId:'majalis-development',storageBucket:'majalis-development.firebasestorage.app',messagingSenderId:'551557724460',appId:'1:551557724460:web:eed6bc7ddd37fe67db5489'},OWNER='HQ8uAskvRBURohdQ7HNWho19apu2',app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app),provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});const D={preseed:{headline:'تمويل الانتقال من منتج أولي مستخدم إلى شركة تقنية جاهزة لجولة البذرة.',investmentAmount:375000,investorPct:5,postMoney:7500000,preMoney:7125000,months:9,seedTarget:30000000,seedRaise:8000000,customers:15,arr:500000,case2Pct:6,case3Pct:7.5,case4Pct:10},seed:{headline:'جولة لتمويل التوسع التجاري وبناء منصة سعودية لإدارة القرارات المؤسسية.',raiseAmount:8000000,preMoney:30000000,postMoney:38000000,investorPct:21.0526,months:24,customers:60,arr:4000000,growth:'2.3×',margin:'70%+'}},F={preseed:[['وصف العرض','headline','text'],['مبلغ الاستثمار','investmentAmount'],['حصة المستثمر %','investorPct'],['التقييم بعد الاستثمار','postMoney'],['التقييم قبل الاستثمار','preMoney'],['مدة التنفيذ بالأشهر','months'],['تقييم جولة البذرة المستهدف','seedTarget'],['حجم جولة البذرة','seedRaise'],['العملاء المستهدفون','customers'],['الإيراد السنوي المتكرر','arr'],['الحالة الثانية %','case2Pct'],['الحالة الثالثة %','case3Pct'],['الحد الأقصى للحماية %','case4Pct']],seed:[['وصف الجولة','headline','text'],['حجم الجولة','raiseAmount'],['التقييم قبل الاستثمار','preMoney'],['التقييم بعد الاستثمار','postMoney'],['حصة الجولة %','investorPct'],['مدة التشغيل بالأشهر','months'],['العملاء المستهدفون','customers'],['الإيراد السنوي المتكرر','arr'],['النمو السنوي','growth','text'],['الهامش الإجمالي','margin','text']]};let stage='preseed';const $=s=>document.querySelector(s),form=$('#form'),status=$('#status'),loginStatus=$('#loginStatus'),mode=$('#mode');function show(el,t,w=0){el.textContent=t;el.className='status'+(w?' warn':'');el.style.display='block'}function msg(t,w=0){show(status,t,w)}function authMsg(e){const c=e?.code||'',host=location.hostname;let t='تعذر تسجيل الدخول. حاول مرة أخرى.';if(c==='auth/unauthorized-domain')t='النطاق غير مصرح في Firebase Authentication. أضف هذا النطاق:\n'+host;else if(c==='auth/popup-blocked')t='حظر المتصفح نافذة Google. اضغط الزر مرة أخرى وسنستخدم التحويل المباشر.';else if(c==='auth/popup-closed-by-user')t='تم إغلاق نافذة Google قبل إكمال الدخول.';else if(c==='auth/cancelled-popup-request')t='تم إلغاء طلب الدخول السابق. اضغط الزر مرة واحدة وانتظر.';else if(c==='auth/network-request-failed')t='تعذر الاتصال بخدمة Google. تحقق من الإنترنت ثم أعد المحاولة.';else if(e?.message)t+='\n'+e.message;show(loginStatus,t,1)}function opts(){mode.innerHTML=stage==='preseed'?'<option value="amount">تثبيت مبلغ الاستثمار وتعديل التقييم</option><option value="post">تثبيت التقييم وتعديل المبلغ</option><option value="both">تثبيت المبلغ والتقييم وحساب النسبة</option>':'<option value="raise">تثبيت حجم الجولة وتعديل الحصة</option><option value="pct">تثبيت الحصة وتعديل التقييم</option><option value="pre">تثبيت التقييم قبل الاستثمار وتعديل حجم الجولة</option>'}function draw(d){form.innerHTML='';F[stage].forEach(([l,k,t='number'])=>form.insertAdjacentHTML('beforeend',`<div class="field ${k==='headline'?'full':''}"><label>${l}</label><input data-k="${k}" type="${t}" ${t==='number'?'step="0.01" min="0"':''} value="${d[k]??''}"></div>`));opts();$('#view').href=stage==='preseed'?'pre-seed.html':'investment.html'}function vals(){const o={};document.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.type==='number'?Number(i.value):i.value);return o}function put(k,n,a){const i=document.querySelector(`[data-k="${k}"]`),x=Math.round(n*100)/100;if(i&&Number(i.value)!==x){i.value=x;a.push(i.previousElementSibling.textContent)}}function calc(showIt=1){const v=vals(),a=[];if(stage==='preseed'){const p=v.investorPct/100;if(mode.value==='amount'&&p>0){const post=v.investmentAmount/p;put('postMoney',post,a);put('preMoney',post-v.investmentAmount,a)}else if(mode.value==='post'){const amt=v.postMoney*p;put('investmentAmount',amt,a);put('preMoney',v.postMoney-amt,a)}else if(v.postMoney>0){put('investorPct',v.investmentAmount/v.postMoney*100,a);put('preMoney',v.postMoney-v.investmentAmount,a)}}else{if(mode.value==='raise'){const post=v.preMoney+v.raiseAmount;put('postMoney',post,a);put('investorPct',v.raiseAmount/post*100,a)}else if(mode.value==='pct'&&v.investorPct>0){const post=v.raiseAmount/(v.investorPct/100);put('postMoney',post,a);put('preMoney',post-v.raiseAmount,a)}else{const post=v.preMoney+v.raiseAmount;put('postMoney',post,a);put('raiseAmount',post*(v.investorPct/100),a)}}if(showIt&&a.length)msg('تم الربط تلقائيا: '+a.join('، '))}async function load(){const s=await get(ref(db,'investment/'+stage));draw({...D[stage],...(s.val()||{})})}document.addEventListener('input',e=>{if(e.target.matches('[data-k],#mode'))calc()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');stage=b.dataset.stage;load()});let redirectFallback=false;$('#login').onclick=async()=>{loginStatus.style.display='none';try{await setPersistence(auth,browserLocalPersistence);if(redirectFallback){await signInWithRedirect(auth,provider);return}await signInWithPopup(auth,provider)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e?.code)){redirectFallback=true;show(loginStatus,'تعذر فتح نافذة Google. اضغط الزر مرة أخرى لإكمال الدخول بالتحويل المباشر.',1)}else authMsg(e)}};$('#logout').onclick=()=>signOut(auth);$('#save').onclick=async()=>{calc(0);try{await set(ref(db,'investment/'+stage),vals());msg('تم الحفظ والنشر، وستظهر القيم مباشرة في صفحة المستثمر.')}catch(e){msg('تعذر الحفظ: '+e.message,1)}};$('#reset').onclick=()=>{draw(D[stage]);msg('تمت استعادة القيم الافتراضية داخل اللوحة. اضغط حفظ لنشرها.',1)};setPersistence(auth,browserLocalPersistence).then(()=>getRedirectResult(auth)).catch(authMsg);onAuthStateChanged(auth,async u=>{const ok=u&&u.uid===OWNER;$('#gate').style.display=ok?'none':'block';$('#work').style.display=ok?'block':'none';if(u&&!ok){show(loginStatus,'تم تسجيل الدخول بالحساب:\n'+(u.email||'بريد غير ظاهر')+'\nلكن هذا الحساب غير مصرح له.\nUID: '+u.uid,1);await signOut(auth)}if(ok){show(loginStatus,'تم تسجيل الدخول بالحساب: '+(u.email||''));load()}});</script></body></html>
