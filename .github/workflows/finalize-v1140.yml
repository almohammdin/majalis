name: Finalize Majalis v1.14.0
on:
  push:
    branches:
      - agent/majalis-v1140-footer-ballot-closing-voice
    paths:
      - .github/workflows/finalize-v1140.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/majalis-v1140-footer-ballot-closing-voice
          fetch-depth: 0
      - name: Apply final adjustments
        run: python .github/scripts/finalize-v1140.py
      - name: Validate implementation
        run: |
          node --check majalis-voice.js
          node --check majalis-upgrade.js
          grep -q "const VERSION='1.14.0'" majalis-upgrade.js
          grep -q "ballot-card:not(.blank-ballot-card)" majalis-upgrade.js
          grep -q "VOICE_IDLE_TIMEOUT_MS=30000" majalis-voice.js
          grep -q "stop('idle')" majalis-voice.js
          grep -q "minutesClosingName" index.html
          grep -q "minutesClosingPosition" index.html
          grep -q "minutesClosingSignature" index.html
          grep -q "minutesClosingDate" index.html
          grep -q "والله الموفق" index.html
          grep -q "blank-ballot-card" index.html
          grep -q "footer-admin-entry" index.html
          test "$(grep -o 'id=\"adminAccessButton\"' index.html | wc -l)" -eq 1
      - name: Commit final result and clean temporary files
        run: |
          rm -f .github/scripts/finalize-v1140.py .github/workflows/finalize-v1140.yml
          git config user.name 'OpenAI Majalis Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html majalis-upgrade.js .github/scripts/finalize-v1140.py .github/workflows/finalize-v1140.yml
          git commit -m 'Finalize Majalis v1.14.0 document and footer refinements'
          git push origin HEAD:agent/majalis-v1140-footer-ballot-closing-voice
