name: Finalize Majalis v1.15.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1153.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stop older runtime modules from downgrading visible version
        run: |
          python - <<'PY'
          from pathlib import Path

          # This module actively stamps the visible footer/document version on every render.
          p = Path('majalis-decision-result.js')
          text = p.read_text(encoding='utf-8')
          old = "const VERSION='1.15.2'"
          if old not in text and "const VERSION='1.15.3'" not in text:
              raise SystemExit('Unexpected decision-result VERSION declaration')
          text = text.replace(old, "const VERSION='1.15.3'", 1)
          p.write_text(text, encoding='utf-8')

          # Force a fresh fetch of the result module from the loader.
          p = Path('majalis-decision-card.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace("./majalis-decision-result.js?v=1.15.2", "./majalis-decision-result.js?v=1.15.3", 1)
          p.write_text(text, encoding='utf-8')

          # Keep the top-level page cache keys on the release version.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('./majalis-decision-card.js?v=1.15.0','./majalis-decision-card.js?v=1.15.3')
          text = text.replace('./majalis-decision-card.js?v=1.15.2','./majalis-decision-card.js?v=1.15.3')
          text = text.replace('./majalis-upgrade.js?v=1.15.0','./majalis-upgrade.js?v=1.15.3')
          text = text.replace('<span class="version">v1.15.0</span>','<span class="version">v1.15.3</span>')
          text = text.replace('<span class="version">v1.15.2</span>','<span class="version">v1.15.3</span>')
          text = text.replace("const TOOL_VERSION='v1.15.0';","const TOOL_VERSION='v1.15.3';")
          text = text.replace("const TOOL_VERSION='v1.15.2';","const TOOL_VERSION='v1.15.3';")
          p.write_text(text, encoding='utf-8')

          # Remove this workflow in the same commit after it has done its job.
          Path('.github/workflows/finalize-v1153.yml').unlink()
          PY

      - name: Validate runtime scripts
        run: |
          node --check majalis-decision-result.js
          node --check majalis-decision-card.js
          node --check majalis-voting-fix-v1153.js
          grep -F "const VERSION='1.15.3'" majalis-decision-result.js
          grep -F "majalis-decision-result.js?v=1.15.3" majalis-decision-card.js
          grep -F "<span class=\"version\">v1.15.3</span>" index.html
          grep -F "const TOOL_VERSION='v1.15.3';" index.html

      - name: Commit final release wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Majalis v1.15.3 runtime version'
          git push origin HEAD:main
