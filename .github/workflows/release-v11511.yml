name: Release Majalis v1.15.11 minutes restore fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v11511.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix minutes restore ReferenceError and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path

          # Fix the strict-mode ReferenceError in majalis-voting-fix-v1153.js.
          p=Path('majalis-voting-fix-v1153.js')
          t=p.read_text(encoding='utf-8')
          old="note.textContent=text,close=doc.querySelector('.minutes-default-closing'),body=doc.querySelector('.minutes-doc-body');close?close.insertAdjacentElement('beforebegin',note):body?.appendChild(note);"
          new="note.textContent=text;const close=doc.querySelector('.minutes-default-closing');const body=doc.querySelector('.minutes-doc-body');close?close.insertAdjacentElement('beforebegin',note):body?.appendChild(note);"
          if old not in t:
              raise SystemExit('minutes close/body bug marker not found')
          t=t.replace(old,new,1)
          t=t.replace("const V=window.MAJALIS_VERSION||'1.15.7'","const V=window.MAJALIS_VERSION||'1.15.11'",1)
          p.write_text(t,encoding='utf-8')

          # Central version and dynamic cache rewrite.
          p=Path('majalis-version.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace("const VERSION='1.15.10';","const VERSION='1.15.11';",1)
          t=t.replace('__majalisVersionCacheRewrite11510','__majalisVersionCacheRewrite11511')
          t=t.replace(r"(?:7|8|9)",r"(?:7|8|9|10)")
          p.write_text(t,encoding='utf-8')

          # Decision loader and base-cache interceptor.
          p=Path('majalis-decision-card.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace("const VERSION='1.15.10';","const VERSION='1.15.11';",1)
          t=t.replace('__majalisBaseCacheRewriteV11510','__majalisBaseCacheRewriteV11511')
          t=t.replace('?v=1.15.10','?v=1.15.11')
          p.write_text(t,encoding='utf-8')

          # Bootstrap: force a fresh app payload and rewrite v1.15.10 references too.
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace("const VERSION='1.15.10';","const VERSION='1.15.11';",1)
          t=t.replace(r"(?:7|8|9)",r"(?:7|8|9|10)")
          p.write_text(t,encoding='utf-8')

          # Keep final tally-header layer aligned if central version is unavailable.
          p=Path('majalis-final-v11510.js')
          t=p.read_text(encoding='utf-8').replace("||'1.15.10'","||'1.15.11'",1)
          p.write_text(t,encoding='utf-8')

          # Regression test: source must declare close/body, and saved meeting data survives JSON reload.
          Path('tests').mkdir(exist_ok=True)
          Path('tests/minutes-restore-v11511.mjs').write_text("""import assert from 'node:assert/strict';
import fs from 'node:fs';

const source=fs.readFileSync('majalis-voting-fix-v1153.js','utf8');
assert.ok(source.includes("const close=doc.querySelector('.minutes-default-closing');const body=doc.querySelector('.minutes-doc-body');"));
assert.ok(!source.includes("note.textContent=text,close=doc.querySelector"));

const saved={
  attendees:[
    {id:'1',name:'شريك 1',attendance:'inperson',ownedUnits:'100'},
    {id:'2',name:'شريك 2',attendance:'inperson',ownedUnits:'80'},
    {id:'3',name:'شريك 3',attendance:'inperson',ownedUnits:'70'},
    {id:'4',name:'شريك 4',attendance:'remote',ownedUnits:'70'},
    {id:'5',name:'شريك 5',attendance:'inperson',ownedUnits:'60'},
    {id:'6',name:'محمد عبدالقادر محمد سيت',attendance:'absent',ownedUnits:'120'}
  ],
  agendaItems:[{id:'a1',title:'قرار',decision:'نص القرار',votesFor:'380',votesAgainst:'0',votesAbstain:'0'}],
  fields:{entityType:'llc',meetingType:'partners',capitalTotalUnits:'500',votingRightsBasis:'equalUnits'}
};
const restored=JSON.parse(JSON.stringify(saved));
assert.equal(restored.attendees.length,6);
assert.equal(restored.agendaItems.length,1);
assert.equal(restored.agendaItems[0].decision,'نص القرار');
const represented=restored.attendees.filter(p=>['inperson','remote'].includes(p.attendance)).reduce((s,p)=>s+Number(p.ownedUnits||0),0);
assert.equal(represented,380);
assert.equal(Number((represented/500*100).toFixed(2)),76);
console.log('Majalis v1.15.11 minutes restore regression test passed.');
""",encoding='utf-8')

          Path('.github/workflows/release-v11511.yml').unlink()
          PY

      - name: Validate
        run: |
          node --check majalis-voting-fix-v1153.js
          node --check majalis-version.js
          node --check majalis-decision-card.js
          node --check majalis-final-v11510.js
          node tests/minutes-restore-v11511.mjs
          grep -F "const close=doc.querySelector('.minutes-default-closing');const body=doc.querySelector('.minutes-doc-body');" majalis-voting-fix-v1153.js
          grep -F "const VERSION='1.15.11';" majalis-version.js
          grep -F "const VERSION='1.15.11';" majalis-decision-card.js
          grep -F "const VERSION='1.15.11';" index.html

      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Majalis v1.15.11 minutes restore fix'
          git push origin HEAD:main
