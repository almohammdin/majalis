name: Stabilize Majalis v1.13.7 upgrade

on:
  push:
    branches:
      - agent/majalis-documents-voting-waqqe-assistant
    paths:
      - .github/workflows/majalis-upgrade-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/majalis-documents-voting-waqqe-assistant
          fetch-depth: 0
      - name: Apply stability patch
        run: python .github/scripts/majalis-upgrade-fix.py
      - name: Validate all Majalis JavaScript
        run: |
          node --check majalis-assistant.js
          node --input-type=module --check < majalis-text-ai.js
          node --input-type=module --check < majalis-voice-tools.js
          node --input-type=module --check < majalis-voice.js
          node --input-type=module --check < majalis-upgrade.js
          grep -q 'signatureSignedMinutes' majalis-upgrade.js
          grep -q 'if(slot.innerHTML!==html)' majalis-upgrade.js
          grep -q "fetchSignedMinutes(currentSignatureMeetingId,'signature')" majalis-upgrade.js
      - name: Commit fixes and remove temporary files
        run: |
          rm -f .github/workflows/majalis-upgrade-fix.yml .github/scripts/majalis-upgrade-fix.py
          git config user.name 'OpenAI Majalis Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add majalis-upgrade.js .github/workflows/majalis-upgrade-fix.yml .github/scripts/majalis-upgrade-fix.py
          git commit -m 'Stabilize Majalis file rendering and signed minutes state'
          git push origin HEAD:agent/majalis-documents-voting-waqqe-assistant
