name: Test Majalis v1.15.0 browser
on:
  push:
    branches: [agent/majalis-decision-card-v1150]
    paths: [.github/workflows/v1150-browser.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/majalis-decision-card-v1150
          fetch-depth: 0
      - run: npm install playwright@1.55 --no-save
      - run: npx playwright install --with-deps chromium
      - name: Run acceptance
        run: |
          python -m http.server 4173 >/tmp/http.log 2>&1 &
          node .github/scripts/v1150-ui-test.mjs
      - name: Clean test files
        if: success()
        run: |
          rm -f .github/scripts/v1150-ui-test.mjs .github/workflows/v1150-browser.yml
          git config user.name 'OpenAI Majalis Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove v1.15.0 browser test'
          git push origin HEAD:agent/majalis-decision-card-v1150
