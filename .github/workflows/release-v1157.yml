name: Release Majalis v1.15.7 consolidated voting fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1157.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build v1.15.7 finalizer and centralize version
        run: |
          python - <<'PY'
          from pathlib import Path

          target='1.15.7'

          # Build the new finalizer from the validated v1.15.6 layer.
          src=Path('majalis-voting-fix-v1156.js')
          text=src.read_text(encoding='utf-8')
          text=text.replace("const V='1.15.6';","const V=window.MAJALIS_VERSION||'1.15.7';",1)
          text=text.replace('majalisVotingFix1156Styles','majalisVotingFix1157Styles')
          text=text.replace('majalis-llc-partners-v1156','majalis-llc-partners-v1157')
          text=text.replace('llc-v1156-management-summary','llc-v1157-management-summary')
          text=text.replace('llc-v1156-decision-summary','llc-v1157-decision-summary')
          text=text.replace('__v1156','__v1157')
          text=text.replace('window.MajalisVotingFix1156={version:V,calculate:calc,cleanDecision,apply};','window.MajalisVotingFix1157={version:V,calculate:calc,cleanDecision,apply};')

          marker="const selected=()=>{const id=String($('decisionCardAgendaId')?.value||'');return agendaItems.find(x=>String(x.id)===id)||null};\n"
          extra="""const RIADA_ENTITY='شركة ريادة الدولية للفنادق والمنتجعات السياحية المحدودة';
const RIADA_DECISIONS=[
'بعد الاطلاع على المادة الثامنة من عقد التأسيس، التي تشترط موافقة شركاء يمثلون 75% على الأقل لتصفية الشركة وتعيين المصفي، وعلى المادة الحادية عشرة المتعلقة بانقضاء الشركة؛ قرر الشركاء الموافقة على حل شركة ريادة الدولية للفنادق والمنتجعات السياحية المحدودة وانقضائها وتصفيتها اختيارياً.',
'بعد الاطلاع على المادة الثامنة من عقد التأسيس؛ قرر الشركاء تعيين الأستاذ جابر شراحيلي مصفياً للشركة لمدة ستة أشهر، بأتعاب قدرها (45,000) خمسة وأربعون ألف ريال، ومنحه الصلاحيات اللازمة لإتمام أعمال التصفية، وتحصيل حقوق الشركة، وسداد التزاماتها، وتمثيلها أمام الجهات المختصة، وإنهاء التراخيص والحسابات، وتوزيع صافي الموجودات على الشركاء، وشطب قيد الشركة بعد انتهاء أعمال التصفية.',
'قرر الشركاء تفويض السيد/ محمد حسن محمد الأمير بمتابعة أعمال المصفي واستلام التقارير المتعلقة بأعمال التصفية.'
];
function entityKey(v){return String(v||'').normalize('NFKC').replace(/[\\u064B-\\u065F\\u0670]/g,'').replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\\u0600-\\u06FFA-Za-z0-9]+/g,' ').replace(/\\s+/g,' ').trim().toLowerCase()}
function isRiadaMeeting(){return llc()&&entityKey($('entityName')?.value).includes(entityKey(RIADA_ENTITY))}
function migrateRiadaMeeting(){
  if(!isRiadaMeeting()||agendaItems.length<3)return false;
  let changed=false;
  const d1=String(agendaItems[0]?.decision||''),d2=String(agendaItems[1]?.decision||''),d3=String(agendaItems[2]?.decision||'');
  const combined=entityKey(d1).includes(entityKey('تعيين الأستاذ جابر شراحيلي'))||entityKey(d1).includes(entityKey('محمد حسن محمد الأمير'));
  if(combined){agendaItems[0].decision=RIADA_DECISIONS[0];changed=true}
  if(!d2.trim()){agendaItems[1].decision=RIADA_DECISIONS[1];changed=true}
  if(!d3.trim()){agendaItems[2].decision=RIADA_DECISIONS[2];changed=true}
  else if(entityKey(d3).includes(entityKey('محمد حسن محمد'))&&!d3.includes('محمد حسن محمد الأمير')){agendaItems[2].decision=d3.replace(/محمد\\s+حسن\\s+محمد\\s+[^\\s،.؛]+/u,'محمد حسن محمد الأمير');changed=true}
  const mode=$('decisionThresholdMode'),percent=$('decisionThresholdPercent'),operator=$('decisionThresholdOperator');
  if(mode&&mode.value!=='custom'){mode.value='custom';changed=true}
  if(percent&&String(percent.value)!=='75'){percent.value='75';changed=true}
  if(operator&&operator.value!=='atLeast'){operator.value='atLeast';changed=true}
  return changed;
}
function reinforceRepresentedRights(){
  if(!llc())return;
  const represented=participants().reduce((sum,p)=>sum+num(participantVotingWeight(p)),0),total=num(typeof capitalVotesTotal==='function'?capitalVotesTotal():0),ratio=pct(represented,total);
  document.querySelectorAll('.ownership-summary-card,#docOwnership .ownership-doc-summary>div').forEach(card=>{const label=card.querySelector('span')?.textContent||'';if(!label.includes('حقوق التصويت الممثلة'))return;const strong=card.querySelector('strong'),small=card.querySelector('small');if(strong)strong.textContent=String(represented);if(small)small.textContent=`من أصل ${total} (${ratio}%)`});
  document.querySelectorAll('.vote-count-status').forEach(el=>{if((el.textContent||'').includes('حقوق التصويت الممثلة'))el.textContent=`حقوق التصويت الممثلة في الاجتماع: ${represented} من أصل ${total}.`});
}
"""
          if marker not in text: raise SystemExit('selected marker not found')
          text=text.replace(marker,marker+extra,1)
          text=text.replace("if(explicit>0)return {p:explicit,op,source:'explicit'};","if(isRiadaMeeting())return {p:75,op:'atLeast',source:'contract'};\n  if(explicit>0)return {p:explicit,op,source:'explicit'};",1)
          old="sentence+=th?(ok?`، واعتمد القرار لتحقق النسبة المطلوبة البالغة ${need}.`:`، ولم يعتمد القرار لعدم تحقق النسبة المطلوبة البالغة ${need}.`):'.';"
          new="sentence+=th?(ok?`، واعتمد القرار لتحقق النسبة المطلوبة البالغة ${thresholdLabel(th)}${isRiadaMeeting()?' وفقًا للمادة الثامنة من عقد التأسيس':''}.`:`، ولم يعتمد القرار لعدم تحقق النسبة المطلوبة البالغة ${thresholdLabel(th)}${isRiadaMeeting()?' وفقًا للمادة الثامنة من عقد التأسيس':''}.`):'.';"
          if old not in text: raise SystemExit('sentence marker not found')
          text=text.replace(old,new,1)
          text=text.replace('function apply(){ensureStyles();patchPrint();cleanDecisionDisplays();applySummaries();stamp()}','function apply(){migrateRiadaMeeting();ensureStyles();patchPrint();cleanDecisionDisplays();applySummaries();reinforceRepresentedRights();stamp()}',1)
          Path('majalis-voting-fix-v1157.js').write_text(text,encoding='utf-8')
          src.unlink()

          # One version source for every visible/document version writer.
          replacements={
            'majalis-upgrade.js':[("const VERSION='1.15.3';","const VERSION=window.MAJALIS_VERSION||'1.15.7';")],
            'majalis-decision-result.js':[("const VERSION='1.15.3'","const VERSION=window.MAJALIS_VERSION||'1.15.7'")],
            'majalis-decision-card-base.js':[("const VERSION='1.15.0'","const VERSION=window.MAJALIS_VERSION||'1.15.7'")],
            'majalis-decision-card-v1151.js':[("const VERSION='1.15.1';","const VERSION=window.MAJALIS_VERSION||'1.15.7';"),("const BASE_SRC='./majalis-decision-card-base.js?v=1.15.0';","const BASE_SRC='./majalis-decision-card-base.js?v=1.15.7';")],
            'majalis-voting-fix-v1153.js':[("const V='1.15.3'","const V=window.MAJALIS_VERSION||'1.15.7'")]
          }
          for name,repls in replacements.items():
            p=Path(name);data=p.read_text(encoding='utf-8')
            for old,new in repls:
              if old in data:data=data.replace(old,new,1)
            p.write_text(data,encoding='utf-8')

          # Loader: fresh cache keys and v1.15.7 finalizer last.
          p=Path('majalis-decision-card.js')
          loader=p.read_text(encoding='utf-8')
          loader=loader.replace("./majalis-decision-card-v1151.js?v=1.15.1","./majalis-decision-card-v1151.js?v=1.15.7")
          loader=loader.replace("./majalis-decision-result.js?v=1.15.3","./majalis-decision-result.js?v=1.15.7")
          loader=loader.replace("./majalis-voting-fix-v1153.js?v=1.15.3","./majalis-voting-fix-v1153.js?v=1.15.7")
          loader=loader.replace("./majalis-voting-fix-v1156.js?v=1.15.6","./majalis-voting-fix-v1157.js?v=1.15.7")
          p.write_text(loader,encoding='utf-8')

          # index.html: load central source before app code; all visible/doc versions use it.
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          anchor='<link rel="stylesheet" href="./majalis-assistant.css?v=1.15.0">'
          if '<script src="./majalis-version.js?v=1.15.7"></script>' not in html:
            html=html.replace(anchor,'<script src="./majalis-version.js?v=1.15.7"></script>\n<link rel="stylesheet" href="./majalis-assistant.css?v=1.15.7">',1)
          else:
            html=html.replace(anchor,'<link rel="stylesheet" href="./majalis-assistant.css?v=1.15.7">',1)
          html=html.replace('<span class="version">v1.15.6</span>','<span class="version" data-majalis-version></span>')
          html=html.replace("const TOOL_VERSION='v1.15.6';","const TOOL_VERSION=window.MAJALIS_VERSION_LABEL;")
          html=html.replace('./majalis-decision-card.js?v=1.15.6','./majalis-decision-card.js?v=1.15.7')
          html=html.replace('./majalis-upgrade.js?v=1.15.6','./majalis-upgrade.js?v=1.15.7')
          for f in ['majalis-assistant.js','majalis-voice-appcheck.js','majalis-text-ai.js','majalis-voice.js']:
            html=html.replace(f+'?v=1.15.0',f+'?v=1.15.7')
          p.write_text(html,encoding='utf-8')

          # Central source also stamps the static page version when DOM is ready.
          p=Path('majalis-version.js')
          ver=p.read_text(encoding='utf-8')
          ver="""(()=>{\n'use strict';\nconst VERSION='1.15.7';\nwindow.MAJALIS_VERSION=VERSION;\nwindow.MAJALIS_VERSION_LABEL=`v${VERSION}`;\nconst stamp=()=>document.querySelectorAll('[data-majalis-version],.site-footer-wrap .version,.doc-footer-version').forEach(el=>el.textContent=window.MAJALIS_VERSION_LABEL);\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',stamp,{once:true});else stamp();\nwindow.MajalisVersion={version:VERSION,label:window.MAJALIS_VERSION_LABEL,stamp};\n})();\n"""
          p.write_text(ver,encoding='utf-8')

          Path('.github/workflows/release-v1157.yml').unlink()
          PY

      - name: Validate release
        run: |
          node --check majalis-version.js
          node --check majalis-decision-card.js
          node --check majalis-voting-fix-v1157.js
          node --check majalis-upgrade.js
          node --check majalis-decision-result.js
          ! grep -q 'window.agendaItems' majalis-voting-fix-v1157.js
          ! grep -q 'window.attendees' majalis-voting-fix-v1157.js
          grep -F "const VERSION='1.15.7';" majalis-version.js
          grep -F "const TOOL_VERSION=window.MAJALIS_VERSION_LABEL;" index.html
          grep -F 'data-majalis-version' index.html
          grep -F 'majalis-voting-fix-v1157.js?v=1.15.7' majalis-decision-card.js
          grep -F "return {p:75,op:'atLeast',source:'contract'}" majalis-voting-fix-v1157.js
          grep -F 'حقوق التصويت الممثلة في الاجتماع:' majalis-voting-fix-v1157.js
          grep -F 'محمد حسن محمد الأمير' majalis-voting-fix-v1157.js
          ! grep -R -n --include='index.html' --include='majalis-version.js' --include='majalis-upgrade.js' --include='majalis-decision-result.js' --include='majalis-voting-fix-v1157.js' "TOOL_VERSION='v1.15\|const VERSION='1.15\|const V='1.15" . | grep -v "majalis-version.js:3:const VERSION='1.15.7';"
          python - <<'PY'
          assert round(380*100/500,2)==76
          assert 76>=75
          assert 75>=75
          assert not 75>75
          PY

      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Majalis v1.15.7 consolidated partner voting fix'
          git push origin HEAD:main
