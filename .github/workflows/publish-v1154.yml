name: Publish Majalis v1.15.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1154.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set v1.15.4 release references
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('./majalis-decision-card.js?v=1.15.3','./majalis-decision-card.js?v=1.15.4')
          text=text.replace('./majalis-upgrade.js?v=1.15.3','./majalis-upgrade.js?v=1.15.4')
          text=text.replace('<span class="version">v1.15.3</span>','<span class="version">v1.15.4</span>')
          text=text.replace("const TOOL_VERSION='v1.15.3';","const TOOL_VERSION='v1.15.4';")
          p.write_text(text,encoding='utf-8')
          Path('.github/workflows/publish-v1154.yml').unlink()
          PY

      - name: Validate release wiring
        run: |
          node --check majalis-decision-card.js
          node --check majalis-voting-fix-v1154.js
          grep -F './majalis-decision-card.js?v=1.15.4' index.html
          grep -F '<span class="version">v1.15.4</span>' index.html
          grep -F "const TOOL_VERSION='v1.15.4';" index.html
          grep -F 'majalis-voting-fix-v1154.js?v=1.15.4' majalis-decision-card.js

      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Majalis v1.15.4'
          git push origin HEAD:main
