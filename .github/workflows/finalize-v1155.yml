name: Finalize Majalis v1.15.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1155.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Promote corrected LLC finalizer to v1.15.5
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('majalis-voting-fix-v1154.js')
          text=src.read_text(encoding='utf-8')
          text=text.replace("const V='1.15.4';","const V='1.15.5';",1)
          text=text.replace('(window.agendaItems||[])','agendaItems')
          text=text.replace('window.agendaItems||[]','agendaItems')
          text=text.replace('(window.attendees||[])','attendees')
          text=text.replace('window.attendees||[]','attendees')
          text=text.replace('window.MajalisVotingFix1154={version:V,calculate:calc,apply};','window.MajalisVotingFix1155={version:V,calculate:calc,cleanDecision,apply};')
          text=text.replace('majalisVotingFix1154Styles','majalisVotingFix1155Styles')
          text=text.replace('majalis-llc-partners-v1154','majalis-llc-partners-v1155')
          text=text.replace('llc-v1154-management-summary','llc-v1155-management-summary')
          text=text.replace('llc-v1154-decision-summary','llc-v1155-decision-summary')
          text=text.replace('__v1154','__v1155')
          Path('majalis-voting-fix-v1155.js').write_text(text,encoding='utf-8')
          src.unlink()

          p=Path('majalis-decision-card.js')
          loader=p.read_text(encoding='utf-8')
          loader=loader.replace("load('./majalis-voting-fix-v1154.js?v=1.15.4')","load('./majalis-voting-fix-v1155.js?v=1.15.5')")
          p.write_text(loader,encoding='utf-8')

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          html=html.replace('./majalis-decision-card.js?v=1.15.4','./majalis-decision-card.js?v=1.15.5')
          html=html.replace('./majalis-upgrade.js?v=1.15.4','./majalis-upgrade.js?v=1.15.5')
          html=html.replace('<span class="version">v1.15.4</span>','<span class="version">v1.15.5</span>')
          html=html.replace("const TOOL_VERSION='v1.15.4';","const TOOL_VERSION='v1.15.5';")
          p.write_text(html,encoding='utf-8')

          Path('.github/workflows/finalize-v1155.yml').unlink()
          PY

      - name: Validate v1.15.5
        run: |
          node --check majalis-voting-fix-v1155.js
          node --check majalis-decision-card.js
          grep -F "const V='1.15.5';" majalis-voting-fix-v1155.js
          ! grep -q 'window.agendaItems' majalis-voting-fix-v1155.js
          ! grep -q 'window.attendees' majalis-voting-fix-v1155.js
          grep -F 'MajalisVotingFix1155' majalis-voting-fix-v1155.js
          grep -F 'majalis-voting-fix-v1155.js?v=1.15.5' majalis-decision-card.js
          grep -F './majalis-decision-card.js?v=1.15.5' index.html
          grep -F '<span class="version">v1.15.5</span>' index.html
          grep -F "const TOOL_VERSION='v1.15.5';" index.html
          python - <<'PY'
          assert round(380*100/500,2)==76
          assert 76>=75
          assert 75>=75
          assert not 75>75
          PY

      - name: Commit final release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Majalis v1.15.5 final LLC voting fixes'
          git push origin HEAD:main
