name: Finalize Majalis v1.15.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1156.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add LLC print cleanup and promote to v1.15.6
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('majalis-voting-fix-v1155.js')
          text=src.read_text(encoding='utf-8')
          text=text.replace("const V='1.15.5';","const V='1.15.6';",1)
          text=text.replace('majalisVotingFix1155Styles','majalisVotingFix1156Styles')
          text=text.replace('majalis-llc-partners-v1155','majalis-llc-partners-v1156')
          text=text.replace('llc-v1155-management-summary','llc-v1156-management-summary')
          text=text.replace('llc-v1155-decision-summary','llc-v1156-decision-summary')
          text=text.replace('__v1155','__v1156')
          text=text.replace('window.MajalisVotingFix1155={version:V,calculate:calc,cleanDecision,apply};','window.MajalisVotingFix1156={version:V,calculate:calc,cleanDecision,apply};')
          print_patch="""function patchPrint(){\n  const base=window.printStylesheet;\n  if(typeof base!=='function'||base.__v1156)return;\n  const wrapped=function(){return base()+(llc()?`\\n.majalis-vote-percentages,.majalis-ballot-results,.vote-narrative,#docTally .majalis-tally-pct,#docDecisions .decision-vote-summary,.decision-represented-note,.decision-basis-note{display:none!important}`:'')};\n  wrapped.__v1156=true;\n  window.printStylesheet=wrapped;\n}\n"""
          if 'function patchPrint(){' not in text:
              text=text.replace('function stamp(){',print_patch+'function stamp(){',1)
          text=text.replace('function apply(){ensureStyles();cleanDecisionDisplays();applySummaries();stamp()}','function apply(){ensureStyles();patchPrint();cleanDecisionDisplays();applySummaries();stamp()}',1)
          Path('majalis-voting-fix-v1156.js').write_text(text,encoding='utf-8')
          src.unlink()

          p=Path('majalis-decision-card.js')
          loader=p.read_text(encoding='utf-8').replace("load('./majalis-voting-fix-v1155.js?v=1.15.5')","load('./majalis-voting-fix-v1156.js?v=1.15.6')")
          p.write_text(loader,encoding='utf-8')

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          html=html.replace('./majalis-decision-card.js?v=1.15.5','./majalis-decision-card.js?v=1.15.6')
          html=html.replace('./majalis-upgrade.js?v=1.15.5','./majalis-upgrade.js?v=1.15.6')
          html=html.replace('<span class="version">v1.15.5</span>','<span class="version">v1.15.6</span>')
          html=html.replace("const TOOL_VERSION='v1.15.5';","const TOOL_VERSION='v1.15.6';")
          p.write_text(html,encoding='utf-8')

          Path('.github/workflows/finalize-v1156.yml').unlink()
          PY

      - name: Validate v1.15.6
        run: |
          node --check majalis-voting-fix-v1156.js
          node --check majalis-decision-card.js
          grep -F "const V='1.15.6';" majalis-voting-fix-v1156.js
          grep -F 'function patchPrint()' majalis-voting-fix-v1156.js
          grep -F 'base()+(llc()?' majalis-voting-fix-v1156.js
          ! grep -q 'window.agendaItems' majalis-voting-fix-v1156.js
          ! grep -q 'window.attendees' majalis-voting-fix-v1156.js
          grep -F 'MajalisVotingFix1156' majalis-voting-fix-v1156.js
          grep -F 'majalis-voting-fix-v1156.js?v=1.15.6' majalis-decision-card.js
          grep -F './majalis-decision-card.js?v=1.15.6' index.html
          grep -F '<span class="version">v1.15.6</span>' index.html
          grep -F "const TOOL_VERSION='v1.15.6';" index.html
          python - <<'PY'
          assert round(380*100/500,2)==76
          assert 76>=75
          assert 75>=75
          assert not 75>75
          PY

      - name: Commit final release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Majalis v1.15.6 with PDF voting cleanup'
          git push origin HEAD:main
