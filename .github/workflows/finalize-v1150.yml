name: Finalize Majalis v1.15.0
on:
  push:
    branches: [agent/majalis-decision-card-v1150]
    paths: [.github/workflows/finalize-v1150.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/majalis-decision-card-v1150
          fetch-depth: 0
      - name: Apply final runtime fixes
        run: python .github/scripts/finalize-v1150.py
      - name: Validate syntax and anchors
        run: |
          node --check majalis-decision-card.js
          node --check majalis-upgrade.js
          grep -q 'majalis-native-file-input' majalis-upgrade.js
          grep -q 'baseDecisionPrintStylesheet' majalis-decision-card.js
          grep -q 'majalis-native-file-input' .github/scripts/v1150-ui-test.mjs
          echo V1150_FINAL_STATIC_OK
      - name: Commit final code
        run: |
          rm -f .github/scripts/finalize-v1150.py .github/workflows/finalize-v1150.yml
          git config user.name 'OpenAI Majalis Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add majalis-upgrade.js majalis-decision-card.js .github/scripts/v1150-ui-test.mjs .github/scripts/finalize-v1150.py .github/workflows/finalize-v1150.yml
          git commit -m 'Finalize decision card printing and attachment picker'
          git push origin HEAD:agent/majalis-decision-card-v1150
