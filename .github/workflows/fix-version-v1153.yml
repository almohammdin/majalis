name: Fix Majalis version v1.15.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-version-v1153.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Normalize visible version and cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = '1.15.3'

          # index.html: visible tool version + cache keys for files that can write/decorate the UI.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('./majalis-decision-card.js?v=1.15.0', f'./majalis-decision-card.js?v={target}')
          text = text.replace('./majalis-upgrade.js?v=1.15.0', f'./majalis-upgrade.js?v={target}')
          text = re.sub(r"(const\s+TOOL_VERSION\s*=\s*['\"]v?)1\.15\.0(['\"])", rf"\g<1>{target}\2", text)
          text = re.sub(r"(const\s+TOOL_VERSION\s*=\s*['\"]v?)1\.15\.2(['\"])", rf"\g<1>{target}\2", text)
          text = text.replace('>v1.15.0<', f'>v{target}<')
          text = text.replace('>v1.15.2<', f'>v{target}<')
          p.write_text(text, encoding='utf-8')

          # The post-loader upgrade module still identified itself as 1.15.0.
          p = Path('majalis-upgrade.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace("const VERSION='1.15.0';", f"const VERSION='{target}';", 1)
          p.write_text(text, encoding='utf-8')

          # Produce an audit of every remaining 1.15.x occurrence in the runtime files.
          audit=[]
          for path in [Path('index.html'), *sorted(Path('.').glob('majalis-*.js'))]:
              data=path.read_text(encoding='utf-8', errors='replace')
              for n,line in enumerate(data.splitlines(),1):
                  if '1.15.' in line or 'TOOL_VERSION' in line or 'doc-footer-version' in line or 'site-footer-wrap' in line:
                      audit.append(f'{path}:{n}: {line[:500]}')
          Path('version-audit-v1153.txt').write_text('\n'.join(audit)+'\n', encoding='utf-8')
          PY

      - name: Validate voting patch syntax
        run: |
          node --check majalis-voting-fix-v1153.js

      - name: Commit normalized version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html majalis-upgrade.js version-audit-v1153.txt
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Normalize Majalis visible version to v1.15.3'
          git push origin HEAD:main
