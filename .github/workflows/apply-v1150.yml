name: Apply Majalis v1.15.0
on:
  push:
    branches: [agent/majalis-decision-card-v1150]
    paths: [.github/workflows/apply-v1150.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/majalis-decision-card-v1150
          fetch-depth: 0
      - name: Apply integration
        run: python .github/scripts/apply-v1150.py
      - name: Validate JavaScript and integration
        run: |
          node --check majalis-decision-card.js
          node --check majalis-upgrade.js
          python - <<'PY'
          from pathlib import Path
          x=Path('index.html').read_text()
          u=Path('majalis-upgrade.js').read_text()
          d=Path('majalis-decision-card.js').read_text()
          checks=[
            ('decision script loaded','majalis-decision-card.js?v=1.15.0' in x),
            ('visible version','v1.15.0' in x),
            ('decision card UI','إنشاء بطاقة قرار' in d and 'اعتماد نتيجة الفرز' in d),
            ('combined mode','جميع المشاركين في مستند واحد' in d),
            ('individual mode','صفحة مستقلة لكل مشارك' in d),
            ('LLC rule','أكثر من 50% من رأس المال' in d),
            ('native attachment label','majalis-attach-file-button' in u and 'for=\\"${inputId}\\"' in u),
            ('attachment full row','grid-column:1/-1!important' in u),
          ]
          bad=[name for name,ok in checks if not ok]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          print('V1150_STATIC_OK')
          PY
      - name: Commit clean result
        run: |
          rm -f .github/scripts/apply-v1150.py .github/workflows/apply-v1150.yml
          git config user.name 'OpenAI Majalis Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html majalis-upgrade.js majalis-decision-card.js .github/scripts/apply-v1150.py .github/workflows/apply-v1150.yml
          git commit -m 'Add decision card and fix invitation attachments'
          git push origin HEAD:agent/majalis-decision-card-v1150
