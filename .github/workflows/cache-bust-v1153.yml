name: Apply Majalis v1.15.3 cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-v1153.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update decision-card cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = './majalis-decision-card.js?v=1.15.0'
          new = './majalis-decision-card.js?v=1.15.3'
          if old not in text:
              if new in text:
                  print('index.html is already on v1.15.3')
                  raise SystemExit(0)
              raise SystemExit('Expected decision-card reference was not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit index change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust Majalis decision cache for v1.15.3'
          git push origin HEAD:main
