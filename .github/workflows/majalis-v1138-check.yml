name: Validate Majalis v1.13.8 hotfix
on:
  push:
    branches:
      - agent/majalis-documents-voting-waqqe-assistant
    paths:
      - .github/workflows/majalis-v1138-check.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/majalis-documents-voting-waqqe-assistant
          fetch-depth: 0
      - name: Correct escaping and validate modules
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('majalis-upgrade.js')
          s=p.read_text().replace("'\\\"':'&quot'","'\\\"':'&quot;'")
          p.write_text(s)
          PY
          node --input-type=module --check < majalis-upgrade.js
          node --input-type=module --check < majalis-text-ai.js
          grep -q "cleanupInitialBlankAttachments" majalis-upgrade.js
          grep -q "ensureAppCheck(true)" majalis-text-ai.js
          grep -q "temporary_error:true" majalis-text-ai.js
      - name: Commit hotfix and remove validation workflow
        run: |
          rm -f .github/workflows/majalis-v1138-check.yml
          git config user.name 'OpenAI Majalis Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add majalis-upgrade.js majalis-text-ai.js .github/workflows/majalis-v1138-check.yml
          git commit -m 'Validate Majalis attachment and text assistant hotfix'
          git push origin HEAD:agent/majalis-documents-voting-waqqe-assistant
